openapi: 3.0.0
info:
  title: SQLDev API
  description: Browser-facing API. Protected operations require the caller's Clerk session JWT.
  version: 2.0.0
paths:
  /api/users/get/{userId}:
    get:
      operationId: getClerkUser
      summary: Get a Clerk user profile
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ClerkUserId"
      responses:
        "200":
          description: Clerk profile fields used by the frontend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClerkUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/list/get:
    get:
      operationId: listView
      summary: List rows in a view
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/one/get/{itemId}:
    get:
      operationId: getViewItem
      summary: Get one view row
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/new/item:
    post:
      operationId: createViewItem
      summary: Create a view item
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/one/patch:
    patch:
      operationId: updateViewItem
      summary: Update a view item
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/tdsTodos/{todoSpaceId}/tree/get:
    get:
      operationId: getTodoTree
      summary: Get a todo tree
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/TodoSpaceId"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/tdsTodos/{todoSpaceId}/tree/move/patch:
    patch:
      operationId: moveTodoItems
      summary: Move todo items
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/TodoSpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/tdsTodos/{todoSpaceId}/new/post:
    post:
      operationId: createTodo
      summary: Create a todo item
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/TodoSpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Read a job owned by the caller
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state. Completed results use the original response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/images/transform:
    post:
      operationId: transformImage
      summary: Queue a typed image transform
      description: Accepts one private storage object and bounded resize options. The image is processed by the private host after the job is read from SQS.
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageTransform"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}:
    get:
      operationId: bucketExists
      summary: Check the linked bucket
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects:
    get:
      operationId: listStorageObjects
      summary: List storage objects for a tab
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - name: tab
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/StorageTab"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteObjects
      summary: Delete objects
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: bypassGovernance
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteKeys"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/presign:
    post:
      operationId: presignObject
      summary: Prepare an upload and return a presigned PUT URL
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/FileName"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/commit:
    post:
      operationId: commitObject
      summary: Commit a prepared upload after the object exists
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PendingUpload"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/abort:
    post:
      operationId: abortObject
      summary: Abort a prepared upload
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PendingUpload"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/download:
    get:
      operationId: downloadObject
      summary: Download an object
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Object not found.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/copy:
    post:
      operationId: copyObject
      summary: Copy an object
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/ObjectKey"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyDestination"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/object:
    delete:
      operationId: deleteSingleObject
      summary: Delete one object
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/ObjectKey"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: versionId
          in: query
          required: false
          schema:
            type: string
        - name: bypassGovernance
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /notify:
    post:
      operationId: Notify
      summary: Publish a notification to an IoT topic
      parameters:
        - in: header
          name: x-notify-secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, message, visibility]
              additionalProperties: false
              properties:
                view:
                  type: string
                message:
                  type: string
                visibility:
                  type: string
                  enum: [public, private]
                recipients:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Notification published.
        "400":
          description: Invalid notification.
        "401":
          description: Notification secret rejected.
        "500":
          description: Notification failed.

  /renderMd:
    post:
      operationId: renderMd
      summary: Render Markdown to HTML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Rendered HTML.
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
        "400":
          description: Invalid request body.

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClerkUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ViewName:
      name: view
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ViewName"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TodoSpaceId:
      name: todoSpaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BucketName:
      name: bucketName
      in: path
      required: true
      schema:
        type: string
    FileName:
      name: fileName
      in: query
      required: true
      schema:
        type: string
    ObjectKey:
      name: key
      in: query
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    JobAccepted:
      description: The work was accepted and will run one EC2 job at a time.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobReceipt"
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: The Clerk session is missing or rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: The caller cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: The requested record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Conflict:
      description: The storage object is not ready to commit or copy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    InternalError:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
  schemas:
    JobReceipt:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
    JobState:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        result:
          description: Present when the job completed. Database jobs return their former response body. Image jobs return an ImageResult with a short-lived URL.
        error:
          $ref: "#/components/schemas/ErrorMessage"
        httpStatus:
          type: integer
          description: Status produced by the finished job. Present for failed jobs and for completed jobs that previously returned an empty body.
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    JsonObject:
      type: object
      additionalProperties: true
    JsonRows:
      type: array
      items:
        $ref: "#/components/schemas/JsonObject"
    ViewName:
      type: string
      enum: [igPosts, tdsTodoSpaces]
    StorageTab:
      type: string
      enum: [public, mine, shared_with_me]
    ClerkUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
    StorageObjectRow:
      type: object
      properties:
        storage_object_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        clerk_user_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        s3_object_key:
          type: string
        file_name:
          type: string
        public:
          type: boolean
    PendingUpload:
      type: object
      required:
        - storageObjectId
        - storageObjectDataId
        - fileName
        - isNewObject
        - s3ObjectKey
      properties:
        storageObjectId:
          type: string
          format: uuid
        storageObjectDataId:
          type: string
          format: uuid
        fileName:
          type: string
        isNewObject:
          type: boolean
        s3ObjectKey:
          type: string
    ImageTransform:
      type: object
      additionalProperties: false
      required: [sourceKey, width, height, fit, format, quality]
      properties:
        sourceKey:
          type: string
          minLength: 1
          description: Key of a storage object in the linked bucket.
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        fit:
          type: string
          enum: [contain, cover]
        format:
          type: string
          enum: [jpeg, png, webp]
        quality:
          type: integer
          minimum: 1
          maximum: 100
    ImageResult:
      type: object
      additionalProperties: false
      required: [url, contentType]
      properties:
        url:
          type: string
          description: Presigned GET URL for the transformed image. It expires after five minutes.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    PresignResponse:
      type: object
      required: [url, key, pendingUpload]
      properties:
        url:
          type: string
        key:
          type: string
        pendingUpload:
          $ref: "#/components/schemas/PendingUpload"
    DeleteKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string
    CopyDestination:
      type: object
      required: [destinationBucket, destinationFileName]
      properties:
        destinationBucket:
          type: string
        destinationFileName:
          type: string
    FormBody:
      type: object
      description: Multipart fields are parsed by the handler.
      properties:
        payload:
          type: string
          format: binary
