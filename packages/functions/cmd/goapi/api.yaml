openapi: 3.0.0
info:
  title: SQLDev API
  description: Browser-facing API. Protected operations require the caller's Clerk session JWT.
  version: 2.0.0
paths:
  /api/users/get/{userId}:
    get:
      operationId: getClerkUser
      summary: Get a Clerk user profile
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ClerkUserId"
      responses:
        "200":
          description: Clerk profile fields used by the frontend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClerkUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/list/get:
    get:
      operationId: listView
      summary: List rows in a view
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/one/get/{itemId}:
    get:
      operationId: getViewItem
      summary: Get one view row
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/new/item:
    post:
      operationId: createViewItem
      summary: Create a view item
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/{view}/one/patch:
    patch:
      operationId: updateViewItem
      summary: Update a view item
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/ViewName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/tdsTodos/{todoSpaceId}/tree/get:
    get:
      operationId: getTodoTree
      summary: Get a todo tree
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/TodoSpaceId"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/tdsTodos/{todoSpaceId}/tree/move/patch:
    patch:
      operationId: moveTodoItems
      summary: Move todo items
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/TodoSpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/views/tdsTodos/{todoSpaceId}/new/post:
    post:
      operationId: createTodo
      summary: Create a todo item
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/TodoSpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FormBody"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Read a job owned by the caller
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state. Completed results use the original response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/references:
    post:
      operationId: resolveStorageReference
      summary: Resolve a storage object for the current viewer
      description: Returns one opaque reference. Missing, deleted, and unauthorized objects share an unavailable result that contains no storage metadata.
      security:
        - clerkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageReferenceRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/references/preview:
    post:
      operationId: previewStorageReference
      summary: Queue a preview of the latest authorized revision
      description: Accepts a storage object id and the revision id from a current resolve result. The storage key stays on the worker.
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePreviewRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/images/transform:
    post:
      operationId: transformImage
      summary: Queue a typed media preview
      description: Accepts one private storage object and bounded resize options. Images, the first PDF page, and a video poster are processed by the private host. A video animation request produces a short looping WebP through the same host.
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageTransform"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}:
    get:
      operationId: bucketExists
      summary: Check the linked bucket
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects:
    get:
      operationId: listStorageObjects
      summary: List storage objects for a tab
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - name: tab
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/StorageTab"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteObjects
      summary: Delete objects
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: bypassGovernance
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteKeys"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/presign:
    post:
      operationId: presignObject
      summary: Prepare an upload and return a presigned PUT URL
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/FileName"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/commit:
    post:
      operationId: commitObject
      summary: Commit a prepared upload after the object exists
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PendingUpload"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/abort:
    post:
      operationId: abortObject
      summary: Abort a prepared upload
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PendingUpload"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/download:
    get:
      operationId: downloadObject
      summary: Download an object
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Object not found.
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/copy:
    post:
      operationId: copyObject
      summary: Copy an object
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/ObjectKey"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyDestination"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/visibility:
    post:
      operationId: setStorageObjectVisibility
      summary: Make an owned object private, or begin the make-public confirmation
      description: >
        Accepted work completes as a ConfirmableOperationResult. Making an object
        public first completes with confirmation_required (the job finishes and
        releases the worker); the browser then confirms with POST /api/confirmations.
        Making an object private completes with visibility_changed.
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageVisibilityChange"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OperationRejected"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/confirmations:
    post:
      operationId: confirmOperation
      summary: Confirm a previously issued confirmation challenge
      description: >
        Runs as a separate job from the one that issued the challenge. The job
        completes with a ConfirmableOperationResult.
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/OperationRejected"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/storage/buckets/{bucketName}/objects/object:
    delete:
      operationId: deleteSingleObject
      summary: Delete one object
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/BucketName"
        - $ref: "#/components/parameters/ObjectKey"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: versionId
          in: query
          required: false
          schema:
            type: string
        - name: bypassGovernance
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /notify:
    post:
      operationId: Notify
      summary: Publish a notification to an IoT topic
      parameters:
        - in: header
          name: x-notify-secret
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, message, visibility]
              additionalProperties: false
              properties:
                view:
                  type: string
                message:
                  type: string
                visibility:
                  $ref: "#/components/schemas/Visibility"
                recipients:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Notification published.
        "400":
          description: Invalid notification.
        "401":
          description: Notification secret rejected.
        "500":
          description: Notification failed.

  /renderMd:
    post:
      operationId: renderMd
      summary: Render Markdown to HTML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Rendered HTML.
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
        "400":
          description: Invalid request body.

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClerkUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ViewName:
      name: view
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ViewName"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TodoSpaceId:
      name: todoSpaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BucketName:
      name: bucketName
      in: path
      required: true
      schema:
        type: string
    FileName:
      name: fileName
      in: query
      required: true
      schema:
        type: string
    ObjectKey:
      name: key
      in: query
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    JobAccepted:
      description: The work was accepted and will run one EC2 job at a time.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobReceipt"
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Unauthorized:
      description: The Clerk session is missing or rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: The caller cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: The requested record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Conflict:
      description: The storage object is not ready to commit or copy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    InternalError:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    OperationRejected:
      description: The request was rejected before any job was submitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationRejectedResult"
  schemas:
    JobReceipt:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
    JobState:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        result:
          description: Present when the job completed. Database jobs return their former response body. Image jobs return an ImageResult with a short-lived URL.
        error:
          $ref: "#/components/schemas/ErrorMessage"
        httpStatus:
          type: integer
          description: Status produced by the finished job. Present for failed jobs and for completed jobs that previously returned an empty body.
        progress:
          $ref: "#/components/schemas/JobProgress"
    JobProgress:
      type: object
      additionalProperties: false
      required: [phase, completed, total]
      properties:
        phase:
          type: string
          enum: [frames, encoding]
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    JsonObject:
      type: object
      additionalProperties: true
    JsonRows:
      type: array
      items:
        $ref: "#/components/schemas/JsonObject"
    ViewName:
      type: string
      enum: [igPosts, tdsTodoSpaces]
    StorageTab:
      type: string
      enum: [public, mine, shared_with_me]
    ClerkUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
    StorageObjectRow:
      type: object
      properties:
        storage_object_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        clerk_user_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        s3_object_key:
          type: string
        file_name:
          type: string
        public:
          type: boolean
        config_version:
          $ref: "#/components/schemas/ConfigRevision"
    OperationKind:
      type: string
      enum: ["storage.visibility.make_public"]
    ConfirmationTargetType:
      type: string
      enum: [storage_object]
    ConfirmationTarget:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/ConfirmationTargetType"
        id:
          type: string
          format: uuid
    ConfigRevision:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    Visibility:
      type: string
      enum: [public, private]
    ChallengeProof:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
    StorageVisibilityChange:
      type: object
      additionalProperties: false
      required: [target, expectedRevision, visibility]
      properties:
        target:
          $ref: "#/components/schemas/ConfirmationTarget"
        expectedRevision:
          $ref: "#/components/schemas/ConfigRevision"
        visibility:
          $ref: "#/components/schemas/Visibility"
    OperationConfirmation:
      type: object
      additionalProperties: false
      required: [operationKind, target, expectedRevision, challengeId, proof]
      properties:
        operationKind:
          $ref: "#/components/schemas/OperationKind"
        target:
          $ref: "#/components/schemas/ConfirmationTarget"
        expectedRevision:
          $ref: "#/components/schemas/ConfigRevision"
        challengeId:
          type: string
          format: uuid
        proof:
          $ref: "#/components/schemas/ChallengeProof"
    RegistryIdentifier:
      type: string
      minLength: 4
      maxLength: 19
      pattern: "^[1-9][0-9]{3,18}$"
      description: >
        Canonical base-10 text of a PostgreSQL signed BIGINT between 1000 and
        9223372036854775807. The pattern is necessary but not sufficient (it admits
        19-digit values above the maximum); the decoders also enforce the numeric
        range and canonical form. Text, not a JSON number, so JavaScript clients
        keep every value exactly.
    AuthoritativeDialogCopy:
      type: object
      additionalProperties: false
      required: [title, description, confirmLabel]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
        confirmLabel:
          type: string
          minLength: 1
          maxLength: 80
      description: >
        Plain text. Each field must contain at least one character outside the
        shared blank class (Unicode White_Space) and is measured in Unicode code
        points. Clients render it as literal text.
    ConfirmationRequiredResult:
      type: object
      additionalProperties: false
      required: [kind, registryId, operationKind, target, expectedRevision, challengeId, proof, expiresAt, dialogCopy]
      properties:
        kind:
          type: string
          enum: [confirmation_required]
        registryId:
          $ref: "#/components/schemas/RegistryIdentifier"
        operationKind:
          $ref: "#/components/schemas/OperationKind"
        target:
          $ref: "#/components/schemas/ConfirmationTarget"
        expectedRevision:
          $ref: "#/components/schemas/ConfigRevision"
        challengeId:
          type: string
          format: uuid
        proof:
          $ref: "#/components/schemas/ChallengeProof"
        expiresAt:
          type: string
          format: date-time
        dialogCopy:
          $ref: "#/components/schemas/AuthoritativeDialogCopy"
    VisibilityChangedResult:
      type: object
      additionalProperties: false
      required: [kind, target, visibility, revision]
      properties:
        kind:
          type: string
          enum: [visibility_changed]
        target:
          $ref: "#/components/schemas/ConfirmationTarget"
        visibility:
          $ref: "#/components/schemas/Visibility"
        revision:
          $ref: "#/components/schemas/ConfigRevision"
    RejectionReason:
      type: string
      enum:
        - forbidden
        - stale_revision
        - invalid_challenge
        - expired_challenge
        - consumed_challenge
        - superseded_challenge
        - idempotency_conflict
    OperationRejectedResult:
      type: object
      additionalProperties: false
      required: [kind, reason]
      properties:
        kind:
          type: string
          enum: [rejected]
        reason:
          $ref: "#/components/schemas/RejectionReason"
    ConfirmableOperationResult:
      description: >
        What a completed visibility or confirmation job returns in JobState.result.
        A domain rejection is a completed job, not a failed one, so its body survives.
      oneOf:
        - $ref: "#/components/schemas/ConfirmationRequiredResult"
        - $ref: "#/components/schemas/VisibilityChangedResult"
        - $ref: "#/components/schemas/OperationRejectedResult"
      discriminator:
        propertyName: kind
        mapping:
          confirmation_required: "#/components/schemas/ConfirmationRequiredResult"
          visibility_changed: "#/components/schemas/VisibilityChangedResult"
          rejected: "#/components/schemas/OperationRejectedResult"
    PendingUpload:
      type: object
      required:
        - storageObjectId
        - storageObjectDataId
        - fileName
        - isNewObject
        - s3ObjectKey
      properties:
        storageObjectId:
          type: string
          format: uuid
        storageObjectDataId:
          type: string
          format: uuid
        fileName:
          type: string
        isNewObject:
          type: boolean
        s3ObjectKey:
          type: string
    StorageReferenceRequest:
      type: object
      additionalProperties: false
      required: [storageObjectId]
      properties:
        storageObjectId:
          type: string
          format: uuid
    StoragePreviewRequest:
      type: object
      additionalProperties: false
      required: [storageObjectId, revisionId, width, height, fit, format, quality, preview]
      properties:
        storageObjectId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        fit:
          type: string
          enum: [contain, cover]
        format:
          type: string
          enum: [jpeg, png, webp]
        quality:
          type: integer
          minimum: 1
          maximum: 100
        preview:
          type: string
          enum: [image, pdf, video, animation]
    ImageTransform:
      type: object
      additionalProperties: false
      required: [sourceKey, width, height, fit, format, quality, preview]
      properties:
        sourceKey:
          type: string
          minLength: 1
          description: Key of a storage object in the linked bucket.
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        fit:
          type: string
          enum: [contain, cover]
        format:
          type: string
          enum: [jpeg, png, webp]
        quality:
          type: integer
          minimum: 1
          maximum: 100
        preview:
          type: string
          enum: [image, pdf, video, animation]
          description: image resizes the object, pdf renders its first page, video selects one frame, and animation renders a short looping WebP from a video.
    ImageResult:
      type: object
      additionalProperties: false
      required: [url, contentType]
      properties:
        url:
          type: string
          description: Presigned GET URL for the transformed image. It expires after five minutes.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    PresignResponse:
      type: object
      required: [url, key, pendingUpload]
      properties:
        url:
          type: string
        key:
          type: string
        pendingUpload:
          $ref: "#/components/schemas/PendingUpload"
    DeleteKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: string
    CopyDestination:
      type: object
      required: [destinationBucket, destinationFileName]
      properties:
        destinationBucket:
          type: string
        destinationFileName:
          type: string
    FormBody:
      type: object
      description: Multipart fields are parsed by the handler.
      properties:
        payload:
          type: string
          format: binary
